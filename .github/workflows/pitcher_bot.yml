name: Run Pitcher Bot every 10 minutes

on:
  schedule:
    - cron: "4,14,24,34,44,54 * * * *"
  workflow_dispatch:

concurrency:
  group: pitcher-bot
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  run-script:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Print schedule debug
        run: |
          echo "Triggered at UTC: $(date -u '+%Y-%m-%d %H:%M:%S')"
          echo "Triggered at ET: $(TZ=America/New_York date '+%Y-%m-%d %H:%M:%S %Z')"

      - name: Ensure pitcher state file exists
        run: |
          test -f pitcher_state.json || echo "{}" > pitcher_state.json

      - name: Run pitcher bot
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.PITCHER_WEBHOOK_URL }}
          ROYALTYWAGERS_WEBHOOK: ${{ secrets.ROYALTYWAGERS_WEBHOOK }}
          ENABLE_DISCORD_NOTIFY: "true"
          ENABLE_WEBSITE_NOTIFY: "true"
          WEBSITE_NOTIFY_URL: ${{ secrets.WEBSITE_NOTIFY_URL }}
          WEBSITE_NOTIFY_SECRET: ${{ secrets.WEBSITE_NOTIFY_SECRET }}
        run: python pitcher_only_bot.py

      - name: Commit updated pitcher state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add pitcher_state.json

          if git diff --staged --quiet; then
            echo "No pitcher state changes to commit."
            exit 0
          fi

          git commit -m "Update pitcher bot state"
          git pull --rebase origin main
          git push origin HEAD:main
